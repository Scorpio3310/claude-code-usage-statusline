name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC) — no token, no secret. One-time
# setup: on npmjs.com, package Settings → Trusted Publisher → GitHub Actions
# with this repo and workflow filename. The very first version has to be
# published manually (the publisher can only be configured on an existing
# package); every tag after that ships from here, with provenance.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm >= 11.5.1 (OIDC trusted publishing support)
        run: npm install -g npm@latest && npm --version

      - name: Versions must agree (tag, package.json, script)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SCRIPT="$(sed -n 's/^export STATUSLINE_VERSION="\(.*\)"/\1/p' statusline-usage.sh | head -1)"
          echo "tag=$TAG package.json=$PKG script=$SCRIPT"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$SCRIPT" ] || {
            echo "::error::version mismatch — bump package.json and STATUSLINE_VERSION before tagging"
            exit 1
          }

      - name: Publish
        run: npm publish --access public
